name: "File Extension Counts"
description: "Summarize file extensions from a provided repository path list and emit deterministic counts for CI hygiene checks."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
